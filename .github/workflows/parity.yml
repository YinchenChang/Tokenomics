name: parity

# 修訂八-B（2026-10-15，工程類）：引擎與網站停用，改為單一 parity job（LibreOffice 重算 → pytest tests/parity）＋ governance ＋ ci-status。
# 刪除 engine-cache job、6 片情境矩陣與 scenario-guard job。CI 結果只供事後對照，不阻擋合併（CLAUDE.md 第 3 節第 4 條）。
# 以下為修訂八之前各版（v5.22–v5.27）的歷史註記，保留供查：
# CLAUDE.md 第 3 節：每次 push 與 PR 執行；任一格不符即失敗（合併閘門）。
# 2026-10-04 提速（工程類）：情境分 6 片並行；結構性測試與兩條重算測試另成一個 job；防空轉測試獨立一個 job；
# engine 計算圖由 engine-cache job 建一次、以 pycel 序列化檔分給 scenario-guard 與 structure-recalc 使用；
# scenarios 的核心斷言用重建引擎，另以 test_cache_matches_fresh 每次 CI 驗證快取與重建精確相等（比對範圍、容差、情境、斷言皆不變）。
# 合併門檻＝名為 parity 的最後一個 job（needs 全部 job，任一未通過即失敗）。
# v5.22（工程類）：on.push 加 branches-ignore: [ci-status]（防循環；GITHUB_TOKEN 推送本就不觸發 workflow，雙重保險）；
# 加 tags: ["**"] 保留「推標籤也跑」的原行為（只寫 branches-ignore 時，標籤推送不再觸發）。
# v5.23（工程類，工作單 3）：(1) LibreOffice 安裝改走 tools/install_libreoffice.sh（--no-install-recommends、apt 重試與逾時、失敗重試一次；
# run 189 的 scenarios 第 4 片因 libreoffice-core 下載約 19 分鐘而逾時）；(2) 每個 job 末尾記錄完整 Python 版本並上傳 pyver-* artifact，由 ci-status 寫入 jobs[].python；
# (3) actions/checkout v4→v5、setup-python v5→v6、upload-artifact v4→v6、download-artifact v4→v7（皆為首個以 Node.js 24 為預設的主版本；download 的 name／pattern 行為不變）。
# 合併門檻（job parity 的名稱、needs、斷言）與任何測試的斷言都沒有改。
# v5.24（工程類，工作單 2）：on.push 加 paths-ignore（docs/**、CHANGELOG.md、根目錄 README.md、CLAUDE.md）：推送的全部變更檔都符合時不觸發 push run。
# 依 GitHub 文件（Workflow syntax → on.push.paths-ignore）：(1) branches-ignore 與 paths-ignore 並存時兩者都須滿足才執行；
# (2)「Path filters are not evaluated for pushes of tags」：推標籤不評估路徑篩選，tags: ["**"] 照常觸發；(3) 只要有一個檔不符 paths-ignore 即執行。
# pull_request 不加 paths-ignore：合併門檻 job parity 必須在每個 PR 上出現。
# v5.27（工程類，工作單 3.1）：兩個 LibreOffice 安裝步驟加 shell: bash。GitHub 文件（Workflow syntax → jobs.<job_id>.steps[*].shell）：未指定 shell 時為
# 「bash -e {0}」，明示 shell: bash 時為「bash --noprofile --norc -eo pipefail {0}」；「When shell: bash is specified, -o pipefail is also applied」。
# 原本 `bash tools/install_libreoffice.sh | tee …` 的結束碼取自 tee（0），安裝失敗仍繼續到測試才因找不到 soffice 失敗（v5.25 run 207／208、v5.26 run 214）。
# 腳本另在成功分支以 command -v soffice 驗證；apt 單次逾時 90／180 → 180／420 秒、嘗試次數 2 → 3。
# v5.27（工作單 3.2）：ci-status 的 failures 只彙整本次嘗試（GITHUB_RUN_ATTEMPT）上傳的 artifact，不再列出前次嘗試的失敗。
on:
  push:
    branches-ignore: [ci-status]
    tags: ["**"]
    paths-ignore:          # v5.24：只改文件的 push 不觸發（pull_request 不加，合併門檻 parity 每個 PR 都要出現）
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"        # 只指根目錄 README（不含 docs/ 以外子目錄的 README）
      - "CLAUDE.md"
  pull_request:

jobs:
  # 沿用 job 名稱 parity（ci-status 與既有檢查名稱不變）。
  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安裝 LibreOffice Calc（headless 重算）
        timeout-minutes: 25
        shell: bash              # 明示 shell: bash → -eo pipefail；腳本失敗時不被 tee 遮蓋
        run: bash tools/install_libreoffice.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pip install -r requirements-dev.txt
      - name: 數值檢查（全部情境與期望值測試，皆讀 LibreOffice 重算值）
        run: python -m pytest tests/parity -v --tb=short -p no:cacheprovider --junitxml=junit.xml
      - name: job summary
        if: always()
        run: python tools/ci_summary.py job "parity" junit.xml tests/parity/_results.json >> "$GITHUB_STEP_SUMMARY"
      - name: 情境覆蓋（scenarios.yaml 全部情境恰各跑一次）
        if: always()
        run: python tools/ci_summary.py gate tests/parity | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 上傳統計
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parity-results-all
          path: |
            tests/parity/_results.json
            junit.xml
          if-no-files-found: ignore
      - name: 記錄 Python 版本（供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "parity" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-parity
          path: pyver.json

  governance:
    name: governance（GOV_Errors 必須為 0；匯出 CSV）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安裝 LibreOffice Calc（export_csv 以 LibreOffice 重算）
        timeout-minutes: 25
        shell: bash
        run: bash tools/install_libreoffice.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pip install -r requirements-dev.txt
      - name: 治理檢查（GOV_Errors 必須為 0）並匯出 SRC_／Interface CSV
        run: python tools/export_csv.py --out data/export | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 上傳匯出 CSV
        uses: actions/upload-artifact@v6
        with:
          name: export-csv
          path: data/export/*.csv
          if-no-files-found: ignore
      - name: 記錄 Python 版本（供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "governance" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-governance
          path: pyver.json

  # v5.22（工程類）：把本次 run 的結果寫進孤立分支 ci-status，供 chat 端 git fetch 讀取（未登入 API 次數不足、讀不到 log）。
  # 只在此 job 提高權限；失敗不得使 run 或 parity 失敗（continue-on-error）；合併門檻仍為 job parity。
  ci-status:
    name: ci-status（結果寫回 ci-status 分支）
    needs: [governance, parity]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: 蒐集本次 run 的 job、失敗測試、失敗 job 的 log 摘錄與重算秒數，寫入 ci-status 分支
        continue-on-error: true      # fork PR 的 GITHUB_TOKEN 唯讀，推送失敗可容忍
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERALL: ${{ needs.parity.result }}
        run: python3 tools/ci_status.py --out status-out --push | tee -a "$GITHUB_STEP_SUMMARY"
