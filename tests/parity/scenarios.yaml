  sheets: [README, Inputs, Spec_Rack, Arch, Serving, Workload, Calib, Tech_Registry, Perf, Sens_Perf, Unit_Cost, DC_Cost, Train_In, Perf_Batch, Training, Sens_Train, Cap_In, Capability, Price_Frontier, Cache_Store, Fleet_1GW, Amortize, Theory_Rev, Sens_Rev, Har_In, Harness, Sens_Har, Interface, L1, Energy, NonNV, Sensitivity, Checks, Gov_Map, Decisions, SRC_HW, SRC_DC, SRC_Model, SRC_Perf, Sources, DB_Evidence]
