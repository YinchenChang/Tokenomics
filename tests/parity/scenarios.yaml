# Parity 情境檔（CLAUDE.md 第 3 節）。
# 每個情境：改寫下列輸入格 → LibreOffice 重算作基準 → 與引擎比對全部公式格。
# 世代 × 層級：Interface 一次算出 5 世代 × 3 成本情境 × 3 層級，每個情境都已涵蓋，不另列組合。
# v5.10 起：另加 2 個 Block 5 情境（floor_0、floor_80，皆以 B5_PFloor 設定）。
# v5.9 起：另加 2 個 Block 5 情境（harness_w1、harness_p3）；情境 b、f 的 SLO 不可達錯誤已於 Excel 端消除，全部情境皆須 0 個錯誤值，錯誤代碼不同亦視為不符。
# v5.8 起：新增 4 個 Block 4 情境，輸入一律用具名範圍（NAME 或 NAME[k]，k 為列索引）；舊情境維持儲存格位址。
# v5.5 起：Block 3（Training）的世代 × 層級同樣一次算出（TRN_／IF_Train*／IF_Prog*），情境 f、g 驗證其輸入連動。
