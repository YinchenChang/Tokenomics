name: parity

# CLAUDE.md 第 3 節：每次 push 與 PR 執行；任一格不符即失敗（合併閘門）。
on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安裝 LibreOffice Calc（headless 重算基準）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc
      - name: 安裝相依套件
        run: pip install -r requirements-dev.txt
      - name: Parity（全部公式格＋具名範圍＋基準與 15 個情境＋函數語意）
        # 不符時，測試訊息會列出前 20 個不符格：頁名、座標、引擎值、Excel 值
        run: python -m pytest tests/parity -v --tb=short -p no:cacheprovider
      - name: 上傳 parity 統計
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: tests/parity/_results.json
          if-no-files-found: ignore
