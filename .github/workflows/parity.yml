name: parity

# CLAUDE.md 第 3 節：每次 push 與 PR 執行；任一格不符即失敗（合併閘門）。
# 2026-10-04 提速（工程類）：情境分 6 片並行；結構性測試與兩條重算測試另成一個 job；防空轉測試獨立一個 job；
# engine 計算圖由 engine-cache job 建一次、以 pycel 序列化檔分給 scenario-guard 與 structure-recalc 使用；
# scenarios 的核心斷言用重建引擎，另以 test_cache_matches_fresh 每次 CI 驗證快取與重建精確相等（比對範圍、容差、情境、斷言皆不變）。
# 合併門檻＝名為 parity 的最後一個 job（needs 全部 job，任一未通過即失敗）。
# v5.22（工程類）：on.push 加 branches-ignore: [ci-status]（防循環；GITHUB_TOKEN 推送本就不觸發 workflow，雙重保險）；
# 加 tags: ["**"] 保留「推標籤也跑」的原行為（只寫 branches-ignore 時，標籤推送不再觸發）。
# v5.23（工程類，工作單 3）：(1) LibreOffice 安裝改走 tools/install_libreoffice.sh（--no-install-recommends、apt 重試與逾時、失敗重試一次；
# run 189 的 scenarios 第 4 片因 libreoffice-core 下載約 19 分鐘而逾時）；(2) 每個 job 末尾記錄完整 Python 版本並上傳 pyver-* artifact，由 ci-status 寫入 jobs[].python；
# (3) actions/checkout v4→v5、setup-python v5→v6、upload-artifact v4→v6、download-artifact v4→v7（皆為首個以 Node.js 24 為預設的主版本；download 的 name／pattern 行為不變）。
# 合併門檻（job parity 的名稱、needs、斷言）與任何測試的斷言都沒有改。
on:
  push:
    branches-ignore: [ci-status]
    tags: ["**"]
  pull_request:

env:
  TOKENOMICS_ENGINE_CACHE: ${{ github.workspace }}/engine-cache/engine.pkl

jobs:
  engine-cache:
    name: engine-cache（建一次計算圖）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: 建圖、重算並序列化
        run: python tools/build_engine_cache.py engine-cache/engine.pkl | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: engine-cache
          path: engine-cache/
          retention-days: 1
      - name: 記錄 Python 版本（v5.23：供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "engine-cache" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-engine-cache
          path: pyver.json

  scenarios:
    name: scenarios（第 ${{ matrix.shard }} 片／共 6）
    needs: engine-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PARITY_SHARD: ${{ matrix.shard }}/6
      PARITY_RESULTS: tests/parity/_results_shard${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安裝 LibreOffice Calc（headless 重算基準）
        timeout-minutes: 10      # v5.23：只裝 libreoffice-calc（--no-install-recommends）、apt 重試與逾時、失敗重試一次（tools/install_libreoffice.sh）
        run: bash tools/install_libreoffice.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v7
        with:
          name: engine-cache
          path: engine-cache/
      - name: Parity 情境（重建引擎：全部公式格＋錯誤值＋增量重算門檻）＋快取等價（此片的情境）
        # 不符時，測試訊息會列出前 20 個不符格：頁名、座標、引擎值、Excel 值
        # test_scenario_parity 一律用重建引擎；test_cache_matches_fresh 以快取載入實例與同一個重建實例精確比對
        run: python -m pytest tests/parity/test_parity.py -k "test_scenario_parity or test_cache_matches_fresh" -v --tb=short -p no:cacheprovider --junitxml=junit.xml
      - name: job summary
        if: always()
        run: python tools/ci_summary.py job "scenarios 第 ${{ matrix.shard }} 片" junit.xml "$PARITY_RESULTS" >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳 parity 統計
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parity-results-scenarios-${{ matrix.shard }}
          path: |
            tests/parity/_results_shard${{ matrix.shard }}.json
            junit.xml
          if-no-files-found: ignore
      - name: 記錄 Python 版本（v5.23：供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "scenarios（第 ${{ matrix.shard }} 片" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-scenarios-${{ matrix.shard }}
          path: pyver.json

  structure-recalc:
    name: structure-recalc（結構性測試＋函數語意＋兩條重算）
    needs: engine-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARITY_RESULTS: tests/parity/_results_structure.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安裝 LibreOffice Calc（headless 重算基準）
        timeout-minutes: 10      # v5.23：只裝 libreoffice-calc（--no-install-recommends）、apt 重試與逾時、失敗重試一次（tools/install_libreoffice.sh）
        run: bash tools/install_libreoffice.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v7
        with:
          name: engine-cache
          path: engine-cache/
      - name: Parity 其餘測試（工作表、名稱、CURRENT、形狀、函數語意、兩條重算）
        # 兩條重算測試（增量 <2 秒、全簿 <2 秒）一律用重建的引擎，不經快取
        run: python -m pytest tests/parity -k "not test_scenario_parity and not test_cache_matches_fresh and not test_scenarios_actually_change_outputs" -v --tb=short -p no:cacheprovider --junitxml=junit.xml
      - name: job summary
        if: always()
        run: python tools/ci_summary.py job "structure-recalc" junit.xml "$PARITY_RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 上傳 parity 統計
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parity-results-structure
          path: |
            tests/parity/_results_structure.json
            junit.xml
          if-no-files-found: ignore
      - name: 記錄 Python 版本（v5.23：供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "structure-recalc" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-structure-recalc
          path: pyver.json

  scenario-guard:
    name: scenario-guard（防空轉：每個情境至少改變一格）
    needs: engine-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v7
        with:
          name: engine-cache
          path: engine-cache/
      - name: 防空轉（test_scenarios_actually_change_outputs；22 次獨立引擎，不需 LibreOffice）
        run: python -m pytest tests/parity/test_parity.py -k test_scenarios_actually_change_outputs -v --tb=short -p no:cacheprovider --junitxml=junit.xml
      - name: job summary
        if: always()
        run: python tools/ci_summary.py job "scenario-guard" junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳 junit（供 ci-status 讀取；名稱不得以 parity-results- 開頭，以免改變 parity job 的情境覆蓋彙總）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-scenario-guard
          path: junit.xml
          if-no-files-found: ignore
      - name: 記錄 Python 版本（v5.23：供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "scenario-guard" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-scenario-guard
          path: pyver.json

  governance:
    name: governance（GOV_Errors 必須為 0；匯出 CSV）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: 治理檢查（GOV_Errors 必須為 0）並匯出 SRC_／Interface CSV
        run: python tools/export_csv.py --out data/export | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 上傳匯出 CSV
        uses: actions/upload-artifact@v6
        with:
          name: export-csv
          path: data/export/*.csv
          if-no-files-found: ignore
      - name: 記錄 Python 版本（v5.23：供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "governance" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-governance
          path: pyver.json

  # 合併閘門：沿用原 job 名稱 parity，既有的必要狀態檢查不必改。
  parity:
    name: parity
    needs: [engine-cache, scenarios, structure-recalc, scenario-guard, governance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v7
        with:
          pattern: parity-results-*
          path: results/
      - name: 各 job 結果
        run: |
          {
            echo "## parity 合併門檻"
            echo "| job | 結果 |"
            echo "|---|---|"
            echo "| engine-cache | ${{ needs.engine-cache.result }} |"
            echo "| scenarios（6 片） | ${{ needs.scenarios.result }} |"
            echo "| structure-recalc | ${{ needs.structure-recalc.result }} |"
            echo "| scenario-guard | ${{ needs.scenario-guard.result }} |"
            echo "| governance | ${{ needs.governance.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 情境覆蓋（scenarios.yaml 全部情境恰各跑一次）
        run: python tools/ci_summary.py gate results/ | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 全部 job 必須通過
        if: needs.engine-cache.result != 'success' || needs.scenarios.result != 'success' || needs.structure-recalc.result != 'success' || needs.scenario-guard.result != 'success' || needs.governance.result != 'success'
        run: |
          echo "有 job 未通過" >&2
          exit 1
      - name: 記錄 Python 版本（v5.23：供 ci-status 寫入 jobs[].python）
        if: always()
        run: python tools/ci_summary.py pyver "parity" pyver.json
      - name: 上傳 Python 版本記錄
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pyver-parity
          path: pyver.json

  # v5.22（工程類）：把本次 run 的結果寫進孤立分支 ci-status，供 chat 端 git fetch 讀取（未登入 API 次數不足、讀不到 log）。
  # 只在此 job 提高權限；失敗不得使 run 或 parity 失敗（continue-on-error）；合併門檻仍為 job parity。
  ci-status:
    name: ci-status（結果寫回 ci-status 分支）
    needs: [engine-cache, scenarios, structure-recalc, scenario-guard, governance, parity]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: 蒐集本次 run 的 job、失敗測試、失敗 job 的 log 摘錄與重算秒數，寫入 ci-status 分支
        continue-on-error: true      # fork PR 的 GITHUB_TOKEN 唯讀，推送失敗可容忍
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERALL: ${{ needs.parity.result }}
        run: python3 tools/ci_status.py --out status-out --push | tee -a "$GITHUB_STEP_SUMMARY"
