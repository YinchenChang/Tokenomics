# Parity 情境檔（CLAUDE.md 第 3 節）。
# 每個情境：改寫下列輸入格 → LibreOffice 重算作基準 → 與引擎比對全部公式格。
# 世代 × 層級：Interface 一次算出 5 世代 × 3 成本情境 × 3 層級，每個情境都已涵蓋，不另列組合。
# v5.8 起：新增 4 個 Block 4 情境，輸入一律用具名範圍（NAME 或 NAME[k]，k 為列索引）；舊情境維持儲存格位址。
# v5.5 起：Block 3（Training）的世代 × 層級同樣一次算出（TRN_／IF_Train*／IF_Prog*），情境 f、g 驗證其輸入連動。
workbook_expectations:            # 版本升級時必須有意識地更新（CLAUDE.md 第 4 節）
  formula_cells: 18596
  defined_names: 228
  block2_names: 28                # IF_{TokRack,TokRackD,TokGW,VReq,CostPre,CostCache,CostDec,CostDecAcct,TokPerJ}_{Luna,Sol,Astra} 與 IF_Util
  display_only_names: 113         # IF_HdrGen／IF_HdrCost（2）、DRV_*（16）、CAL_*（19）、TRN_*（15）、TR_*（23）、B4_*（38；v5.8 新增，顯示或內部用）；僅供網站顯示，下游不得連結
  b4_names: 38
  drv_names: 16
  cal_names: 19
  downstream_names: 113           # IF_ 開頭且非 IF_Hdr：下游模型可連結（v5.4 為 38；v5.5 加 25；v5.6 加 IF_TrainGenDefault／IF_TrainGenAlt；v5.7 加 IF_TrainGenDefaultName／IF_TrainGenAltName；v5.8 加 46＝Interface D 節 Price*／FrontRef／FrontModel／Life／CacheStore／AmortBU／AmortTD／FullCost／RevGW*／ServeShare／FreeShare）
  block3_names: 25                # IF_{TrainGPUh,TrainCost,PostShareFLOP,PostShareGPUh,RLMFU,ProgGPUh,ProgCost,ProgGWyr}_{Luna,Sol,Astra} 與 IF_RDMult
  trn_names: 15                   # TRN_*：Training 推導鏈（含表頭 TRN_Gen、TRN_Tier）；僅供網站顯示
  sheets: [README, Inputs, Spec_Rack, Arch, Serving, Workload, Calib, Tech_Registry, Perf, Sens_Perf, Unit_Cost, DC_Cost, Train_In, Perf_Batch, Training, Sens_Train, Cap_In, Capability, Price_Frontier, Cache_Store, Fleet_1GW, Amortize, Theory_Rev, Sens_Rev, Interface, Energy, NonNV, Sensitivity, Checks, Sources, DB_Evidence]
  evidence_columns: 11            # DB_Evidence 純輸入、無公式；表頭列 A4:K4
  tr_names: 23                    # TR_*：Tech_Registry 唯讀表（登錄表 20 個、各 12 格；掛鉤彙總 3 個、各 11 格）
  tr_rows: 12
  tr_hook_rows: 11
  trn_columns: 15                 # TRN_ 每個名稱的欄數：5 世代 × 3 層級
  cal_f_points: 7                 # CAL_F_* 每個名稱的格數
  cal_h_points: 4                 # CAL_H_* 每個名稱的格數
  drv_columns: 15                 # Perf 推導鏈：5 世代 × 3 層級

scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_vr_peak_high
    description: VR 峰值高情境（Serving!C16＝2）
    inputs: {"Serving!C16": 2}
  - id: b_prod_derate
    description: 生產折減（Serving!C18＝0.7）
    inputs: {"Serving!C18": 0.7}
  - id: c_astra_kv_gqa8
    description: Astra KV GQA-8（Arch!E20＝3）
    inputs: {"Arch!E20": 3}
  - id: d_low_power
    description: 低功率情境（Inputs!E6＝1）
    inputs: {"Inputs!E6": 1}
  - id: e_util_08
    description: 利用率 0.8（Serving!C17＝0.8）
    inputs: {"Serving!C17": 0.8}
  - id: f_registry_t07_t09_on
    description: Tech_Registry T07–T09 開啟（Tech_Registry!O11:O13＝1）
    inputs: {"Tech_Registry!O11": 1, "Tech_Registry!O12": 1, "Tech_Registry!O13": 1}
  - id: g_rd_mult_low
    description: 研發倍數取低端 4.4（Train_In!C13＝4.4；Epoch 區間下限）
    inputs: {"Train_In!C13": 4.4}
  # ── v5.8：Block 4 情境（輸入一律用具名範圍） ──
  - id: b4_f_disc_03
    description: 折扣 0.3（B4_Disc）；營收與有效單價全面變動
    inputs: {"B4_Disc": 0.3}
  - id: b4_g_peak_mode_1
    description: 尖峰模式 1（B4_PeakMode）；DeepSeek 兩列的時段係數變動
    inputs: {"B4_PeakMode": 1}
  - id: b4_h_eps_05_comp_7
    description: 能力單價彈性 0.5 且能力倍數 7（B4_Eps、B4_CompMult）；能力單價倍數 ≠ 1
    inputs: {"B4_Eps": 0.5, "B4_CompMult": 7}
  - id: b4_i_front_model_opus
    description: Claude Opus 5.5（B4_MktIndex 第 6 列）能力指數＝53；Astra 前緣模型由「Claude Fable 5.1」改為「Claude Opus 5.5」，測試 MATCH 與文字輸出路徑
    inputs: {"B4_MktIndex[6]": 53}
