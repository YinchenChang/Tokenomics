    inputs: {"Serving!C18": 0.7}
  - id: c_astra_kv_gqa8
    description: Astra KV GQA-8（Arch!E20＝3）
    inputs: {"Arch!E20": 3}
  - id: d_low_power
    description: 低功率情境（Inputs!E6＝1）
    inputs: {"Inputs!E6": 1}
  - id: e_util_08
    description: 利用率 0.8（Serving!C17＝0.8）
