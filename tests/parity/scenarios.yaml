scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_vr_peak_high
    description: VR 峰值高情境（Serving!C16＝2）
    inputs: {"Serving!C16": 2}
  - id: b_prod_derate
    description: 生產折減（Serving!C18＝0.7）
    inputs: {"Serving!C18": 0.7}
  - id: c_astra_kv_gqa8
    description: Astra KV GQA-8（Arch!E20＝3）
    inputs: {"Arch!E20": 3}
  - id: d_low_power
    description: 低功率情境（Inputs!E6＝1）
    inputs: {"Inputs!E6": 1}
  - id: e_util_08
    description: 利用率 0.8（Serving!C17＝0.8）
    inputs: {"Serving!C17": 0.8}
  - id: f_registry_t07_t09_on
    description: Tech_Registry T07–T09 開啟（Tech_Registry!O11:O13＝1）
    inputs: {"Tech_Registry!O11": 1, "Tech_Registry!O12": 1, "Tech_Registry!O13": 1}
  - id: g_rd_mult_low
    description: 研發倍數取低端 4.4（Train_In!C13＝4.4；Epoch 區間下限）
    inputs: {"Train_In!C13": 4.4}
  # ── v5.8：Block 4 情境（輸入一律用具名範圍） ──
  - id: b4_f_disc_03
    description: 折扣 0.3（B4_Disc）；營收與有效單價全面變動
    inputs: {"B4_Disc": 0.3}
  - id: b4_g_peak_mode_1
    description: 尖峰模式 1（B4_PeakMode）；DeepSeek 兩列的時段係數變動
    inputs: {"B4_PeakMode": 1}
  - id: b4_h_eps_05_comp_7
    description: 能力單價彈性 0.5 且能力倍數 7（B4_Eps、B4_CompMult）；能力單價倍數 ≠ 1
    inputs: {"B4_Eps": 0.5, "B4_CompMult": 7}
  - id: b4_i_front_model_opus
    description: Claude Opus 5.5（B4_MktIndex 第 6 列）能力指數＝53；Astra 前緣模型由「Claude Fable 5.1」改為「Claude Opus 5.5」，測試 MATCH 與文字輸出路徑
    inputs: {"B4_MktIndex[6]": 53}
  # ── v5.9：Block 5 情境 ──
  - id: harness_w1
    description: T12（Harness）全採用（Tech_Registry!O16＝1、N16＝1）；Workload、Harness、Theory_Rev C、Interface E 改變，Interface A–D 不變
    inputs: {"Tech_Registry!O16": 1, "Tech_Registry!N16": 1}
  - id: harness_p3
    description: 同 harness_w1，另 B5_Profile＝3（選定 harness 檔案）
    inputs: {"Tech_Registry!O16": 1, "Tech_Registry!N16": 1, "B5_Profile": 3}
  # ── v5.10：Block 5 可靠度下限情境（M1；輸入一律用具名範圍） ──
  - id: floor_0
    description: B5_PFloor＝0（不設成功率下限）；Harness H 節前緣與「對照（不設下限）」列相同，Coding agent 為 Luna｜選定
    inputs: {"B5_PFloor": 0}
  - id: floor_80
    description: B5_PFloor＝0.8；Coding agent 無合格組合（IF_FrontSuccVR／Name／P 為「無合格」），Checks 無合格任務數＝1
    inputs: {"B5_PFloor": 0.8}
  # ── v5.11：治理 Stage 1 情境（Gate 1 第 3.5、3.6 節） ──
  - id: gw_2
    description: IT 電力規模 CTL_GW＝2（Inputs!E5）；F14 後每 GW 名稱只剩 FLOOR 取整殘差
    inputs: {"CTL_GW": 2}
  - id: src_hw038_x1_1
    description: SRC_HW_038（VR200 FP8 訓練峰值，全架）1,260→1,386 PF（×1.1）；Gate 1 驗收測試，影響限 VR200 欄
    inputs: {"SRC_HW_038": 1386}
  # ── v5.15：Block 6（Alloc）情境；輸入一律用具名範圍 ──
  - id: h_alloc_no_refresh
    description: 改版計畫數 N_refresh＝0（AL_Nrefresh）；研發 GW 只剩家族計畫，Q1、Q2 下降
    inputs: {"AL_Nrefresh": 0}
  - id: h_alloc_k_high
    description: 計畫規模倍數 k＝7（AL_k；區間上限）
    inputs: {"AL_k": 7}
  - id: h_alloc_tok_high
    description: 每則提示 token 數＝6,000（AL_TokPerPrompt；A10 區間上限）；需求 D 與服務 GW 上升
    inputs: {"AL_TokPerPrompt": 6000}
  - id: h_alloc_growth
    description: 機隊年成長率 g＝0.5（AL_g）；只改成長情境列（Alloc D 節），基準 Q1、Q2 與 Interface F 節不變
    inputs: {"AL_g": 0.5}
  - id: h_alloc_mix_2025
    description: 補充 2：2025 機隊世代組合 Hopper 60%／GB200 40%（AL_MixHopper、AL_MixGB200、AL_MixGB300、AL_MixVR200）；服務 GW、Q1、Q2 與支出路線對照改變
    inputs: {"AL_MixHopper": 0.6, "AL_MixGB200": 0.4, "AL_MixGB300": 0, "AL_MixVR200": 0}
  # ── v5.19：X1 生產折減並列輸出（輸入用具名範圍 CTL_ProdDerate） ──
  - id: h_prod_derate_070
    description: 並列輸出用生產折減 CTL_ProdDerate＝0.7（區間下限）；Serving!C18 仍為 1.0、基準列不變；Hopper 欄 _Prod 的 FullCost 為文字「SLO 不可達」，其餘 _Prod 列改變
    inputs: {"CTL_ProdDerate": 0.7}
  # ── v5.22：X7 壽命期價格係數 L、變現率 m 並列輸出（輸入用具名範圍 CTL_PriceLife、CTL_Monetize） ──
  - id: h_price_life_050
    description: 壽命期價格係數 CTL_PriceLife＝0.5、變現率 CTL_Monetize＝0.8；四個 _Life 列（60 格）＝基準列 × 0.4，基準列、L1、Interface 第 1–210 列不變
    inputs: {"CTL_PriceLife": 0.5, "CTL_Monetize": 0.8}
  # ── v5.23：X10 Perf_Batch 側 VR200 批次口徑 η_d 倍數（Calib I 節，CAL_BatchEtaD 的第 4 格＝VR200） ──
  - id: h_batch_etad_100
    description: CAL_BatchEtaD 的 VR200 格設回 1（＝v5.22 的 Perf_Batch 口徑）；全部具名範圍（除 IDX_SrcID）須與 v5.22 逐格相等，只有 X10 造成改變
    inputs: {"CAL_BatchEtaD[4]": 1.0}
