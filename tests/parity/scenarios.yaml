scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_vr_peak_high
    description: VR 峰值高情境（Serving!C16＝2）
    inputs: {"Serving!C16": 2}
  - id: b_prod_derate
    description: 生產折減（Serving!C18＝0.7）
    inputs: {"Serving!C18": 0.7}
  - id: c_astra_kv_gqa8
    description: Astra KV GQA-8（Arch!E20＝3）
    inputs: {"Arch!E20": 3}
  - id: d_low_power
    description: 低功率情境（Inputs!E6＝1）
    inputs: {"Inputs!E6": 1}
  - id: e_util_08
    description: 利用率 0.8（Serving!C17＝0.8）
    inputs: {"Serving!C17": 0.8}
  - id: f_registry_t07_t09_on
    description: Tech_Registry T07–T09 開啟（Tech_Registry!O11:O13＝1）
    inputs: {"Tech_Registry!O11": 1, "Tech_Registry!O12": 1, "Tech_Registry!O13": 1}
  - id: g_rd_mult_low
    description: 研發倍數取低端 4.4（Train_In!C13＝4.4；Epoch 區間下限）
    inputs: {"Train_In!C13": 4.4}
  # ── v5.8：Block 4 情境（輸入一律用具名範圍） ──
  - id: b4_f_disc_03
    description: 折扣 0.3（B4_Disc）；營收與有效單價全面變動
    inputs: {"B4_Disc": 0.3}
  - id: b4_g_peak_mode_1
    description: 尖峰模式 1（B4_PeakMode）；DeepSeek 兩列的時段係數變動
    inputs: {"B4_PeakMode": 1}
  - id: b4_h_eps_05_comp_7
    description: 能力單價彈性 0.5 且能力倍數 7（B4_Eps、B4_CompMult）；能力單價倍數 ≠ 1
    inputs: {"B4_Eps": 0.5, "B4_CompMult": 7}
  - id: b4_i_front_model_opus
    description: Claude Opus 5.5（B4_MktIndex 第 6 列）能力指數＝53；Astra 前緣模型由「Claude Fable 5.1」改為「Claude Opus 5.5」，測試 MATCH 與文字輸出路徑
    inputs: {"B4_MktIndex[6]": 53}
  # ── v5.9：Block 5 情境 ──
  - id: harness_w1
    description: T12（Harness）全採用（Tech_Registry!O16＝1、N16＝1）；Workload、Harness、Theory_Rev C、Interface E 改變，Interface A–D 不變
    inputs: {"Tech_Registry!O16": 1, "Tech_Registry!N16": 1}
  - id: harness_p3
    description: 同 harness_w1，另 B5_Profile＝3（選定 harness 檔案）
    inputs: {"Tech_Registry!O16": 1, "Tech_Registry!N16": 1, "B5_Profile": 3}
  # ── v5.10：Block 5 可靠度下限情境（M1；輸入一律用具名範圍） ──
  - id: floor_0
    description: B5_PFloor＝0（不設成功率下限）；Harness H 節前緣與「對照（不設下限）」列相同，Coding agent 為 Luna｜選定
    inputs: {"B5_PFloor": 0}
  - id: floor_80
    description: B5_PFloor＝0.8；Coding agent 無合格組合（IF_FrontSuccVR／Name／P 為「無合格」），Checks 無合格任務數＝1
    inputs: {"B5_PFloor": 0.8}
  # ── v5.11：治理 Stage 1 情境（Gate 1 第 3.5、3.6 節） ──
  - id: gw_2
    description: IT 電力規模 CTL_GW＝2（Inputs!E5）；F14 後每 GW 名稱只剩 FLOOR 取整殘差
    inputs: {"CTL_GW": 2}
  - id: src_hw038_x1_1
    description: SRC_HW_038（VR200 FP8 訓練峰值，全架）1,260→1,386 PF（×1.1）；Gate 1 驗收測試，影響限 VR200 欄
    inputs: {"SRC_HW_038": 1386}
